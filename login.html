<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MADO ADMIN — Acceso</title><link rel="stylesheet" href="../public/styles.css"></head><body><main class="hero" style="min-height:100vh;max-width:650px"><div class="eyebrow">// MADO DESARROLLOS / ADMIN</div><h1 style="font-size:clamp(3.5rem,8vw,7rem)">Acceso<br><span>administrativo.</span></h1><div class="modal-box" style="width:100%;position:relative"><label class="tag">CORREO</label><input id="email" style="width:100%;margin:12px 0 20px;background:#0c1425;border:1px solid #243047;padding:14px;color:#fff"><label class="tag">CONTRASEÑA</label><input id="password" type="password" style="width:100%;margin:12px 0 20px;background:#0c1425;border:1px solid #243047;padding:14px;color:#fff"><button class="button primary" style="cursor:pointer" onclick="login()">Entrar →</button><a class="button" href="../public/index.html" style="margin-left:8px">Volver al sitio</a><p id="msg" class="muted"></p></div></main><script>function login(){const e=document.getElementById('email').value,p=document.getElementById('password').value;if(e&&p){sessionStorage.setItem('mado_admin_demo','1');location.href='dashboard.html'}else document.getElementById('msg').textContent='Escribe correo y contraseña para entrar a la demo.'}</script></body></html>
